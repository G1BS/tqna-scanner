name: TQNA FA/TA Scanner

on:
  schedule:
    - cron: "0 16 * * *"   # once daily at 16:00 UTC (4 PM)
  workflow_dispatch:
    inputs:
      test_force_topic_ids:
        description: "Comma-separated TradingQnA topic IDs to force-test the extraction prompt on (leave empty for a normal run)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEST_FORCE_TOPIC_IDS: ${{ github.event.inputs.test_force_topic_ids }}
        run: |
          set -o pipefail
          mkdir -p logs
          python scanner.py 2>&1 | tee logs/last_run.log

      - name: Commit debug log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/last_run.log
          git commit -m "Update debug log [skip ci]" || echo "No changes to commit"
          git push
